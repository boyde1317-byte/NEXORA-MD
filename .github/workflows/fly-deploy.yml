name: Deploy NEXORA-MD to Fly.io

# Auto-deploy: every push to main ships to Fly (plus a manual run button).
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight deploy instead of queueing behind it.
concurrency:
  group: fly-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
