# fly.toml app configuration file generated for nexoraflex on 2026-11-16T19:23:00Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nexoraflex'
primary_region = 'lhr'

[build]
[env]
  DB_PATH = '/app/data/db.json'
  NEXORA_MENU_GIF_URL = 'https://base44.app/api/apps/6acfd0aaa54519204c9b5698/files/mp/public/6acfd0aaa54519204c9b5698/50442af8d_nexora-menu-loop.mp4'
  NODE_ENV = 'production'
  PORT = '3000'
  SESSION_PATH = '/app/data/session'

[[mounts]]
  source = 'nexora_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
